server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # CoreDNS (cluster DNS). Resolving at request time means nginx still starts if a backend Service is briefly missing.
    resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;

    # Probes. /health = process alive. /ready = nginx can serve (backends are checked by their own readiness).
    location = /health { access_log off; default_type application/json; return 200 '{"status":"ok"}'; }
    location = /ready  { access_log off; default_type application/json; return 200 '{"status":"ready"}'; }

    location /static/ { expires 1h; add_header Cache-Control "public"; try_files $uri =404; }

    location = /api/products {
        set $upstream http://product-service.cloudcart.svc.cluster.local:8080;
        proxy_pass $upstream/products;
    }
    location ~ ^/api/products/(.*)$ {
        set $upstream http://product-service.cloudcart.svc.cluster.local:8080;
        proxy_pass $upstream/products/$1$is_args$args;
    }
    location = /api/orders {
        set $upstream http://order-service.cloudcart.svc.cluster.local:8080;
        proxy_pass $upstream/orders;
    }
    location ~ ^/api/orders/(.*)$ {
        set $upstream http://order-service.cloudcart.svc.cluster.local:8080;
        proxy_pass $upstream/orders/$1;
    }

    location / { try_files $uri /index.html; }
}
