# Namespace-level config + one ServiceAccount per service.
# ServiceAccount names are the contract with terraform/08-pod-identity: "cloudcart/<service>" -> IAM role (no annotation needed).
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudcart-config
  namespace: {{ .Release.Namespace }}
data:
  SSM_PREFIX: {{ .Values.global.ssmPrefix | quote }}
  AWS_REGION: {{ .Values.global.region | quote }}
  AWS_DEFAULT_REGION: {{ .Values.global.region | quote }}
  LOG_LEVEL: INFO
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
