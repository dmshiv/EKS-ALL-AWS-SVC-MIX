{{- if .Values.networkPolicies.enabled }}
# Allow rules on top of the platform default-deny-ingress (terraform/42-network-policies). Explained in kubernetes/network-policies/.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alb-to-frontend
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: frontend}
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock: {cidr: {{ .Values.global.vpcCidr | quote }}}
      ports:
        - {protocol: TCP, port: {{ .Values.services.frontend.port }}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-to-apis
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/name, operator: In, values: [product-service, order-service]}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: frontend}
      ports:
        - {protocol: TCP, port: 8080}
{{- end }}
