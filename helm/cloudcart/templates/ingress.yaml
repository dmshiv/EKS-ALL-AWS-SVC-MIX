{{- if .Values.ingress.enabled }}
# ALB created by the AWS Load Balancer Controller. Annotations explained in kubernetes/ingress/ingress.yaml.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudcart
  namespace: {{ .Release.Namespace }}
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "10"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "2"
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=30
    {{- if .Values.global.albCertificateArn }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/certificate-arn: {{ .Values.global.albCertificateArn | quote }}
    {{- else }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    {{- end }}
    {{- if .Values.global.wafAclArn }}
    alb.ingress.kubernetes.io/wafv2-acl-arn: {{ .Values.global.wafAclArn | quote }}
    {{- end }}
    {{- if .Values.global.accessLogsBucket }}
    alb.ingress.kubernetes.io/load-balancer-attributes: access_logs.s3.enabled=true,access_logs.s3.bucket={{ .Values.global.accessLogsBucket }},access_logs.s3.prefix=alb,idle_timeout.timeout_seconds=60
    {{- end }}
    {{- if .Values.global.originDomain }}
    external-dns.alpha.kubernetes.io/hostname: {{ .Values.global.originDomain | quote }}
    {{- end }}
spec:
  ingressClassName: alb
  rules:
    - {{- if .Values.global.originDomain }}
      host: {{ .Values.global.originDomain | quote }}
      {{- end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port: {number: {{ .Values.services.frontend.servicePort }}}
{{- end }}
