# EBS DEMO: Pod -> PVC -> StorageClass gp3-encrypted -> EBS CSI driver -> encrypted gp3 volume in the pod's AZ.
# Namespace cloudcart; delete the PVC afterwards (a PVC left behind keeps an EBS volume billing).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ebs-demo
  namespace: cloudcart
spec:
  accessModes: [ReadWriteOnce]       # one node at a time (block device)
  storageClassName: gp3-encrypted
  resources:
    requests: {storage: 4Gi}
---
apiVersion: v1
kind: Pod
metadata:
  name: ebs-demo
  namespace: cloudcart
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    fsGroup: 10001                    # makes the mounted volume writable by the non-root user
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: writer
      image: public.ecr.aws/docker/library/busybox:1.37
      command: ["sh", "-c", "date >> /data/log.txt; cat /data/log.txt; sleep 3600"]
      securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
      resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 32Mi}}
      volumeMounts: [{name: data, mountPath: /data}]
  volumes:
    - name: data
      persistentVolumeClaim: {claimName: ebs-demo}
