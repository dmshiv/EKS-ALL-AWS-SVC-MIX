# NETWORK LOAD BALANCER (layer 4) for the order-service, as a CONTRAST to the ALB path.
#
#   client --TCP--> NLB (static EIPs from terraform/30-nlb, one per AZ) --> target group (pod IPs) --> order-service :8080
#
# WHEN AN NLB: non-HTTP protocols, static IPs customers allow-list, client IP preservation, very high connection rates, PrivateLink.
# WHEN AN ALB: HTTP routing, WAF, redirects, auth. NLB has NO WAF and NO path routing: do not expose a public API like this in production.
# LAB ONLY: the NLB is open to the world on tcp/8080. Restrict with loadBalancerSourceRanges.
# Render:  scripts/render-k8s.sh (fills ${NLB_EIPS} ${NLB_SUBNETS})
apiVersion: v1
kind: Service
metadata:
  name: order-service-nlb
  namespace: cloudcart
  annotations:
    # "external" + nlb-target-type=ip hands the Service to the AWS Load Balancer Controller (not the legacy in-tree cloud provider).
    service.beta.kubernetes.io/aws-load-balancer-type: external
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    service.beta.kubernetes.io/aws-load-balancer-subnets: ${NLB_SUBNETS}
    service.beta.kubernetes.io/aws-load-balancer-eip-allocations: ${NLB_EIPS}
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-protocol: http
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-path: /health
spec:
  type: LoadBalancer
  loadBalancerClass: service.k8s.aws/nlb
  loadBalancerSourceRanges: ["0.0.0.0/0"]
  selector: {app.kubernetes.io/name: order-service}
  ports:
    - {name: tcp, port: 8080, targetPort: http, protocol: TCP}
