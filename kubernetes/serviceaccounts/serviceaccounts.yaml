# ServiceAccounts for the CloudCart workloads.
#
# THE NAMES MATTER: terraform/08-pod-identity creates an association "cloudcart/<name> -> IAM role" for product-service, order-service and
# worker. A ServiceAccount with the same namespace and name automatically receives that role's temporary credentials through the EKS Pod
# Identity agent. NO annotation is needed (that is IRSA, see irsa-demo.yaml). The frontend has an SA but NO association = no AWS access.
#
# automountServiceAccountToken: false -> pods do not receive a Kubernetes API token they never use (smaller blast radius). Pod Identity does not
# need the default token mount: it uses its own projected token injected by the EKS webhook.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend
  namespace: cloudcart
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: product-service
  namespace: cloudcart
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: order-service
  namespace: cloudcart
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker
  namespace: cloudcart
automountServiceAccountToken: false
