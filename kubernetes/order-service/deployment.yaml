apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: cloudcart
  labels: {app.kubernetes.io/name: order-service, app.kubernetes.io/part-of: cloudcart}
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app.kubernetes.io/name: order-service}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-service
        app.kubernetes.io/part-of: cloudcart
        # Label used by kubernetes/security-groups-for-pods/securitygrouppolicy.yaml to give these pods their own security group.
        cloudcart.io/db-access: "true"
    spec:
      serviceAccountName: order-service      # Pod Identity association: Secrets Manager (DB creds) + SQS send + SSM read
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: {matchLabels: {app.kubernetes.io/name: order-service}}
      containers:
        - name: app
          image: ${IMAGE_REGISTRY}/cloudcart-order-service:${IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          envFrom: [{configMapRef: {name: cloudcart-config}}]
          resources:
            requests: {cpu: 100m, memory: 160Mi}
            limits: {memory: 320Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
          startupProbe: {httpGet: {path: /health, port: http}, periodSeconds: 3, failureThreshold: 30}
          livenessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 10, timeoutSeconds: 2, failureThreshold: 3}
          # /ready opens a DB connection: a security-group, password or network problem keeps the pod OUT of the Service (and the ALB)
          # instead of serving 5xx. This is the first signal in the "pod cannot connect to RDS" troubleshooting flow.
          readinessProbe: {httpGet: {path: /ready, port: http}, periodSeconds: 5, timeoutSeconds: 3, failureThreshold: 2}
      volumes:
        - name: tmp
          emptyDir: {}
