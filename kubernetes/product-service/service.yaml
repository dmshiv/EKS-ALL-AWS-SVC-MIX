apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: cloudcart
  labels: {app.kubernetes.io/name: product-service}
spec:
  # ClusterIP: reachable only inside the cluster (the frontend proxies to it). Exposure to the internet is the Ingress's job.
  type: ClusterIP
  selector: {app.kubernetes.io/name: product-service}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: product-service
  namespace: cloudcart
spec:
  # Node drains (upgrades, Karpenter consolidation) may evict at most one replica at a time.
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: product-service}
