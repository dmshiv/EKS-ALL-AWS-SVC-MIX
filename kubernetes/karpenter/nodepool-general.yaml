# GENERAL pool: On-Demand or Spot, Karpenter picks the cheapest instance that fits the pending pods (Spot preferred when allowed).
# Used by frontend and the two APIs (they run several replicas, so a Spot interruption is absorbed by the others + the PDBs).
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: general
spec:
  template:
    metadata:
      labels: {cloudcart.io/node-role: general}
    spec:
      nodeClassRef: {group: karpenter.k8s.aws, kind: EC2NodeClass, name: default}
      requirements:
        - {key: karpenter.sh/capacity-type, operator: In, values: [spot, on-demand]}
        - {key: kubernetes.io/arch, operator: In, values: [amd64]}
        - {key: karpenter.k8s.aws/instance-category, operator: In, values: [c, m, r]}
        - {key: karpenter.k8s.aws/instance-generation, operator: Gt, values: ["4"]}
        - {key: karpenter.k8s.aws/instance-size, operator: In, values: [large, xlarge, 2xlarge]}
      # nodes are recycled every 30 days so they pick up new AMIs and patches
      expireAfter: 720h
  # GUARDRAIL: total vCPUs this pool may ever provision (stops a runaway scale-out bill).
  limits:
    cpu: "16"
  # CONSOLIDATION: delete empty nodes and replace under-used ones with cheaper/smaller ones, 1 minute after the change.
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
