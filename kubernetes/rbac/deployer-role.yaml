# KUBERNETES RBAC vs EKS ACCESS ENTRIES (terraform/07-eks-access).
#
#   Access entry  : AWS-side. Maps an IAM principal -> a Kubernetes identity (username + groups) and optionally attaches an EKS ACCESS POLICY
#                   (managed ClusterRole-like permission sets scoped to the cluster or namespaces). Managed with the EKS API (Terraform, CloudTrail).
#   Kubernetes RBAC: cluster-side. Role/ClusterRole + RoleBinding say what a user/group may do. Needed for CUSTOM permissions beyond the managed
#                   access policies. The link between the two worlds is the GROUP name in the access entry (kubernetes_groups).
#
# EXAMPLE: CI pipelines authenticate with an IAM role (access entry with kubernetes_groups = ["cloudcart-deployers"]); this Role/RoleBinding then
# grants exactly "update Deployments and read Pods in cloudcart" to that group, nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployer
  namespace: cloudcart
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployer
  namespace: cloudcart
subjects:
  - kind: Group
    name: cloudcart-deployers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: deployer
  apiGroup: rbac.authorization.k8s.io
