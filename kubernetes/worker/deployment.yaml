apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: cloudcart
  labels: {app.kubernetes.io/name: worker, app.kubernetes.io/part-of: cloudcart}
spec:
  # Replicas are driven by queue depth (see kubernetes/autoscaling/hpa-worker.yaml and docs/scaling). Each replica long-polls SQS.
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 1, maxSurge: 1}
  selector:
    matchLabels: {app.kubernetes.io/name: worker}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/part-of: cloudcart
    spec:
      serviceAccountName: worker       # Pod Identity: SQS receive/delete + Secrets Manager + EventBridge PutEvents + SSM read
      # Time to finish the in-flight message after SIGTERM (visibility timeout is 60s; the worker stops polling and drains).
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      # SPOT FRIENDLY: stateless and idempotent, so it may run on interruptible capacity. The toleration lets it land on the tainted
      # Karpenter "batch-spot" pool; the PREFERRED affinity keeps it working even if that pool does not exist (it then uses any node).
      tolerations:
        - {key: cloudcart.io/workload, operator: Equal, value: batch, effect: NoSchedule}
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - {key: cloudcart.io/node-role, operator: In, values: [batch-spot]}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: {matchLabels: {app.kubernetes.io/name: worker}}
      containers:
        - name: app
          image: ${IMAGE_REGISTRY}/cloudcart-worker:${IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          envFrom: [{configMapRef: {name: cloudcart-config}}]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
          startupProbe: {httpGet: {path: /health, port: http}, periodSeconds: 3, failureThreshold: 30}
          livenessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 10, timeoutSeconds: 2, failureThreshold: 3}
          readinessProbe: {httpGet: {path: /ready, port: http}, periodSeconds: 5, timeoutSeconds: 3, failureThreshold: 2}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: worker
  namespace: cloudcart
spec:
  maxUnavailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: worker}
